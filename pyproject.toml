[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trolllib"
version = "0.1.0"
description = "A tiny library that does one thing when you import it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["template", "example"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yourname/trolllib"
Issues = "https://github.com/yourname/trolllib/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "twine>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/trolllib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]